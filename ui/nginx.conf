server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The console calls the core on the same origin, so the browser needs no CORS.
  location /v1/ { proxy_pass http://core:8000; proxy_set_header Host $host; }
  location /health { proxy_pass http://core:8000; }
  location / { try_files $uri /index.html; }
}
